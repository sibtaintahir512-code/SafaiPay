version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: safaipay-postgres
    restart: always
    environment:
      POSTGRES_USER: safaipay_user
      POSTGRES_PASSWORD: safaipay_password
      POSTGRES_DB: safaipay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safaipay_user -d safaipay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safaipay-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: safaipay-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://safaipay_user:safaipay_password@db:5432/safaipay_db
      SYNC_DATABASE_URL: postgresql://safaipay_user:safaipay_password@db:5432/safaipay_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: safaipay-production-secret-change-this-in-deployment
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: safaipay-ml
    restart: always
    ports:
      - "8001:8001"

volumes:
  postgres_data:
  redis_data:
